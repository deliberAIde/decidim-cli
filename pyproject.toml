[project]
name = "decidim-cli"
version = "0.1.0"
description = "Command-line client for driving Decidim instances over their GraphQL API: read, export, create/update component resources, and normalize data for synthesis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
decidim = "decidim_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decidim_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

